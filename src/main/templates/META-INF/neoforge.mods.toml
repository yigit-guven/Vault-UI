modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
displayURL="https://github.com/yigit-guven/Vault-UI"
issueTrackerURL="https://github.com/yigit-guven/Vault-UI/issues"
authors="Yigit Guven"
credits="Special thanks to the Create Team for their mod."
description='''
An addon for the Create mod that provides a custom user interface for Vaults.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[0.6,)"
    ordering="AFTER"
    side="BOTH"
